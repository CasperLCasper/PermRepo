name: 'PermRepo — Mūžīgs Arweave Backups'
description: 'Inkrementāls Git repo backups uz Arweave visām CI platformām'
author: 'PermRepo'
branding:
  icon: 'archive'
  color: 'green'
inputs:
  wallet_address:
    description: 'Tava maka publiskā adrese'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true
  issue_body:
    description: 'Issue body'
    required: false
  issue_number:
    description: 'Issue number'
    required: false
outputs:
  status:
    description: 'Backupa statuss'
runs:
  using: 'node24'
  main: 'action/dist/index.js'
