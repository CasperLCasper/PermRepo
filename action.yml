name: 'PermRepo — Mūžīgs Arweave Backups'
description: 'Inkrementāls Git repo backups uz Arweave, izmantojot Render serveri un Turbo SDK'
author: 'PermRepo'
branding:
  icon: 'archive'
  color: 'green'
inputs:
  wallet_address:
    description: 'Tava maka publiskā adrese'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true
  render_url:
    description: 'Render servera URL (piem., https://virsburts-permrepo-server.onrender.com)'
    required: true
  render_api_key:
    description: 'Render servera API atslēga (ja nepieciešama)'
    required: false
outputs:
  status:
    description: 'Backupa statuss'
runs:
  using: 'node20'
  main: 'action/src/index.js'
