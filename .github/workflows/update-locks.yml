name: Update package-lock.json

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Update action/package-lock.json
        working-directory: action
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Update cli/package-lock.json
        working-directory: cli
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add action/package-lock.json cli/package-lock.json
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update package-lock.json [skip ci]"
            git push
          else
            echo "package-lock.json jau ir aktuāls, nav izmaiņu."
          fi
