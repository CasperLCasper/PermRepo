name: PermRepo Backup

on:
  issues:
    types: [opened]

jobs:
  verify-and-backup:
    if: contains(github.event.issue.title, '[PermRepo Backup]')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      
      - name: Verify and Backup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RPC_URL: ${{ secrets.RPC_URL }}
          SUBSCRIPTION_ADDRESS: ${{ secrets.SUBSCRIPTION_ADDRESS }}
          NFT_ADDRESS: ${{ secrets.NFT_ADDRESS }}
          REGISTRY_ADDRESS: ${{ secrets.REGISTRY_ADDRESS }}
          TURBO_UPLOAD_URL: ${{ secrets.TURBO_UPLOAD_URL }}
          TURBO_PAYMENT_URL: ${{ secrets.TURBO_PAYMENT_URL }}
          ARWEAVE_WALLET: ${{ secrets.ARWEAVE_WALLET }}
        run: node action/src/index.js
