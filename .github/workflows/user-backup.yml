name: PermRepo Backup

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  backup:
    if: contains(github.event.issue.title, '[PermRepo Backup]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run PermRepo Backup
        uses: CasperLCasper/PermRepo@main
        with:
          wallet_address: ${{ secrets.WALLET_ADDRESS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          issue_body: ${{ github.event.issue.body }}
          issue_number: ${{ github.event.issue.number }}
