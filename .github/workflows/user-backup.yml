name: PermRepo Backup

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  backup:
    if: contains(github.event.issue.title, '[PermRepo Backup]')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run PermRepo Backup
        uses: CasperLCasper/PermRepo@main
        with:
          wallet_address: ${{ secrets.WALLET_ADDRESS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          render_url: ${{ secrets.RENDER_URL }}
          render_api_key: ${{ secrets.RENDER_API_KEY }}
