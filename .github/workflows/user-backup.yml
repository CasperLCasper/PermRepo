name: PermRepo Backup

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  backup:
    if: contains(github.event.issue.title, '[PermRepo Backup]')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4
      
      - name: Clone PermRepo
        run: git clone https://github.com/CasperLCasper/Virsburts_PermRepo.git /tmp/permrepo
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        working-directory: /tmp/permrepo/action
        run: npm install
      
      - name: Run Backup
        working-directory: /tmp/permrepo/action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node src/index.js
