<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Iemaksāt Glabāšanai</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container text-center">
    <h1>💰 Iemaksāt Glabāšanai</h1>
    <p class="subtitle">Iemaksā nepieciešamo summu Treasury līgumā</p>
    
    <div class="info-row text-left">
        <span class="info-label">Treasury adrese</span>
        <span class="info-value word-break" id="treasuryAddress">0x349c78525Dbb6aCfE60c96546174dC1627028b62</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label">Summa</span>
        <span class="info-value" id="amountDisplay">Ielādē...</span>
    </div>
    
    <button id="payButton" class="sign-button">💳 Iemaksāt ar MetaMask</button>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
</div>
<script type="module" src="js/pay-storage.js"></script>
</body>
</html>
