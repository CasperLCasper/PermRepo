<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — NFT Kalšana</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP' 'sha256-WrRKNEQJuBTIa2LeLWiSbGZoaDSwoPyZbztmPDf4ZDQ=' 'sha256-qO7byyFOPoHQQz0Z3RlmKIUohDJKUoTXcH8Ppbzazfw='; style-src 'self' 'sha256-nxL3MzvYjHvTQ9QfRxsJ00GpDzD73+NcUnJdEPl6/ns='; connect-src https://sepolia.base.org https://mainnet.base.org; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container text-center">
    <h1>🔒 PermRepo NFT</h1>
    <p class="subtitle">Ielīmē GitHub repozitorija URL vai nosaukumu</p>
    
    <div class="info-row text-left">
        <span class="info-label">Repo</span>
        <input type="text" id="repoInput" placeholder="https://github.com/lietotajs/repo" value="" style="width:100%;padding:8px;margin-top:4px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#e6edf3;">
    </div>
    <div class="info-row text-left">
        <span class="info-label">Maksa</span>
        <span class="info-value">Bezmaksas</span>
    </div>
    
    <button id="mintButton" class="sign-button" disabled>⏳ Gaida savienojumu...</button>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" integrity="sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP" crossorigin="anonymous"></script>
<script>
const NFT_ADDRESS = '0xeD3eB455cAeb057a034d7bE2368cdCEA37Faa1d4';
const CHAIN_ID = '0x14a34';
const params = new URLSearchParams(window.location.search);
const repoFromUrl = params.get('repo') || '';
document.getElementById('repoInput').value = repoFromUrl;

const ABI = ["function mintRepository(address,string) external returns(uint256)"];

let signer, userAddress;

async function init() {
    if (!window.ethereum) {
        document.getElementById('error').textContent = '❌ Instalē MetaMask vai citu kripto maku';
        return;
    }
    
    try {
        await ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID }] });
        const provider = new ethers.BrowserProvider(ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        
        document.getElementById('mintButton').disabled = false;
        document.getElementById('mintButton').textContent = '🔒 Generate NFT';
        document.getElementById('mintButton').onclick = mintNFT;
        document.getElementById('status').textContent = '✅ Gatavs kalšanai';
    } catch(e) {
        document.getElementById('error').textContent = '❌ Kļūda: ' + e.message;
    }
}

function extractRepoName(input) {
    if (!input) return null;
    input = input.trim();
    
    let match = input.match(/github\.com\/([^/]+\/[^/]+?)(?:\.git)?$/);
    if (match) return match[1];
    
    match = input.match(/gitlab\.com\/([^/]+\/[^/]+?)(?:\.git)?$/);
    if (match) return match[1];
    
    match = input.match(/bitbucket\.org\/([^/]+\/[^/]+?)(?:\.git)?$/);
    if (match) return match[1];
    
    if (input.includes('/') && input.length >= 3) return input;
    
    return null;
}

async function mintNFT() {
    const rawInput = document.getElementById('repoInput').value;
    const repo = extractRepoName(rawInput);
    
    if (!repo) {
        document.getElementById('error').textContent = '❌ Nevarēja noteikt repozitorija nosaukumu. Ievadi URL vai lietotajs/repo';
        return;
    }
    
    try {
        document.getElementById('mintButton').disabled = true;
        document.getElementById('mintButton').textContent = '⏳ Gaida...';
        document.getElementById('status').textContent = `Veido NFT priekš: ${repo}`;
        document.getElementById('error').textContent = '';
        
        const contract = new ethers.Contract(NFT_ADDRESS, ABI, signer);
        const tx = await contract.mintRepository(userAddress, repo);
        await tx.wait();
        
        document.getElementById('status').textContent = `✅ NFT izveidots priekš: ${repo}`;
        document.getElementById('mintButton').textContent = '✅ Gatavs';
        
    } catch(e) {
        if (e.code === 'ACTION_REJECTED') {
            document.getElementById('error').textContent = '❌ Transakcija atcelta';
        } else {
            document.getElementById('error').textContent = '❌ Kļūda: ' + e.message;
        }
        document.getElementById('mintButton').disabled = false;
        document.getElementById('mintButton').textContent = '🔒 Generate NFT';
    }
}

init();
</script>
</body>
</html>
