<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Localhost Upload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0d1117; color: #e6edf3; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; max-width: 600px; width: 100%; }
        h1 { color: #79c0ff; margin-bottom: 16px; }
        .file { padding: 8px 0; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; }
        button { width: 100%; padding: 14px; background: #238636; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; }
        button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
        .status { text-align: center; margin-top: 16px; color: #b0b8c4; }
        .error { color: #f85149; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>PermRepo — Augsupielade Arweave</h1>
    <div id="fileList"></div>
    <div class="status" id="status">Notiek failu iegusana...</div>
    <button id="uploadButton" disabled>⏳ Gaida...</button>
    <div class="error" id="error"></div>
</div>
<script src="bundle.js"></script>
<script src="localhost-upload.js"></script>
</body>
</html>
