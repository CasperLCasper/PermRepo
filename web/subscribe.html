<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Abonements</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP'; style-src 'self'; connect-src https://sepolia.base.org https://mainnet.base.org; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>💎 PermRepo Abonements</h1>
    <p class="subtitle">$2 USDC / 30 dienas — viens abonements vienam NFT (repo)</p>
    <div class="info-row"><span class="info-label">Cena</span><span class="info-value">2 USDC</span></div>
    <div class="info-row"><span class="info-label">Periods</span><span class="info-value">30 dienas</span></div>
    <label for="tokenId">NFT Token ID</label>
    <input type="number" id="tokenId" name="tokenId" placeholder="Piemēram: 1" min="1">
    <div class="total">2 USDC</div>
    <button id="btn" disabled>⏳ Gaida savienojumu...</button>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" integrity="sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP" crossorigin="anonymous"></script>
<script src="js/subscribe.js"></script>
</body>
</html>
