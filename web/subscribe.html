<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Abonements</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP'; style-src 'self'; connect-src https://sepolia.base.org https://mainnet.base.org; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    
    <link rel="stylesheet" href="data:text/css,*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px;max-width:480px;width:100%}h1{font-size:24px;margin-bottom:8px;color:#79c0ff}.subtitle{color:#b0b8c4;margin-bottom:24px;font-size:14px}.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #21262d}.info-label{color:#b0b8c4}.info-value{font-weight:600}input{width:100%;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:16px;margin-top:8px}input:focus{outline:none;border-color:#58a6ff}.total{font-size:20px;font-weight:700;color:#3fb950;text-align:center;margin:24px 0}button{width:100%;padding:14px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}button:hover{background:#2ea043}button:disabled{background:#21262d;color:#8b949e;cursor:not-allowed}.status{text-align:center;margin-top:16px;font-size:14px;color:#b0b8c4}.error{color:#f85149;margin-top:12px;text-align:center;font-size:14px}">
</head>
<body>
<div class="container">
    <h1>💎 PermRepo Abonements</h1>
    <p class="subtitle">$2 USDC / 30 dienas — viens abonements vienam NFT (repo)</p>
    <div class="info-row"><span class="info-label">Cena</span><span class="info-value">2 USDC</span></div>
    <div class="info-row"><span class="info-label">Periods</span><span class="info-value">30 dienas</span></div>
    
    <label class="info-label" style="margin-top:16px;display:block;">NFT Token ID</label>
    <input type="number" id="tokenId" placeholder="Piemēram: 1" min="1" style="margin-bottom:16px;">
    
    <div class="total">2 USDC</div>
    <button id="btn" disabled>⏳ Gaida savienojumu...</button>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js" integrity="sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP" crossorigin="anonymous"></script>
<script>
const SUBSCRIPTION_ADDRESS = '0x...';
const USDC_ADDRESS = '0x036CbD53842c5426634e7929541eC2318f3dCF7e';
const CHAIN_ID = '0x14a34';

const ABI = ["function subscribe(uint256 tokenId) external"];
const ERC20_ABI = ["function approve(address,uint256) external returns(bool)","function allowance(address,address) external view returns(uint256)"];

let contract, usdc, signer, userAddress;

async function init() {
    if (!window.ethereum) { 
        document.getElementById('error').textContent = '❌ Instalē MetaMask'; 
        return; 
    }
    try {
        await ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID }] });
        const p = new ethers.BrowserProvider(ethereum);
        signer = await p.getSigner();
        userAddress = await signer.getAddress();
        contract = new ethers.Contract(SUBSCRIPTION_ADDRESS, ABI, signer);
        usdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').textContent = '💎 Aktivizēt abonementu';
        document.getElementById('btn').onclick = subscribe;
        document.getElementById('status').textContent = '✅ Savienots (Base Sepolia)';
    } catch(e) { 
        document.getElementById('error').textContent = '❌ Kļūda: ' + e.message; 
    }
}

async function subscribe() {
    const tokenId = document.getElementById('tokenId').value;
    if (!tokenId || tokenId < 1) {
        document.getElementById('error').textContent = '❌ Lūdzu, ievadi NFT Token ID';
        return;
    }
    
    try {
        document.getElementById('btn').disabled = true;
        document.getElementById('btn').textContent = '⏳ Gaida apstiprinājumu...';

        const price = ethers.parseUnits('2', 6);
        const allowance = await usdc.allowance(userAddress, SUBSCRIPTION_ADDRESS);
        if (allowance < price) {
            document.getElementById('status').textContent = '1/2: Apstiprini USDC atļauju...';
            const approveTx = await usdc.approve(SUBSCRIPTION_ADDRESS, price);
            await approveTx.wait();
        }

        document.getElementById('status').textContent = '2/2: Apstiprini abonementu...';
        const tx = await contract.subscribe(tokenId);
        await tx.wait();

        document.getElementById('status').textContent = '✅ Abonements aktivizēts!';
        document.getElementById('btn').textContent = '✅ Gatavs';
    } catch(e) {
        document.getElementById('error').textContent = '❌ ' + e.message;
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').textContent = '💎 Aktivizēt abonementu';
    }
}

await init();
</script>
</body>
</html>
